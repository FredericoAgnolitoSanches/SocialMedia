<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../../Styles/LoginStyles/singup.css">
    <script src="../../JS/signup-preview.js" defer></script>
</head>
<body id="bodySingUp">
    <main class="signup-layout">
    <form method="post">
        <fieldset>
            <legend>Create an account</legend>
            <p class="form-intro">A fresh start. A space to connect.</p>
            <p>
                <label for="user">Username:</label>
                <input type="text" id="user" name="txtUser" placeholder="Choose a username" autocomplete="username" required>
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
            </p>
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
            </p>
            <p>
                <label for="profile-photo">Profile photo (optional):</label>
                <input type="text" id="profile-photo" name="profilePhoto" placeholder="Paste your profile photo URL" aria-describedby="photo-hint">
                <small id="photo-hint">Use a direct image URL. Without a photo, your initials will appear.</small>  
            </p>
            <button type="submit">Sign up</button>
            <p class="signup-prompt">Already have an account? <a href="singin.html">Sign in</a></p>
        </fieldset>
    </form>
    <aside class="profile-preview" aria-label="Profile preview">
        <div class="avatar">
            <span id="profile-initials">?</span>
            <img id="profile-image" alt="Your profile photo" referrerpolicy="no-referrer" hidden>
        </div>
        <h2 id="preview-name">Your name</h2>
        <p>Your profile preview</p>
    </aside>
    </main>
</body>
</html>
