<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="../../Styles/LoginStyles/singup.css">
</head>
<body>
    <form method="post" id="loginForm">
        <fieldset>
            <legend>Sign in</legend>
            <p class="form-intro">Welcome back. Your space to connect.</p>
            <p>
                <label for="user">Username:</label>
                <input type="text" id="user" name="txtUser" placeholder="Enter your username" autocomplete="username" required>
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </p>
            <button type="submit">Sign in</button>
            <p class="signup-prompt">Don't have an account? <a href="singup.html">Sign up</a></p>
        </fieldset>
    </form>

    <script src="../../JS/Login/singIn.js"></script>
</body>
</html>
